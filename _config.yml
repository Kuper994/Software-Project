title: Software Project
author: Rami Nasser
copyright: "2023"
only_build_toc_files: true

execute:
  execute_notebooks: "off"

parse:
  myst_enable_extensions:
    - dollarmath
    - amsmath
    - linkify
    - colon_fence

html:
  use_issues_button: true
  use_repository_button: true
  use_download_button: true
  use_fullscreen_button: true
  home_page_in_navbar: false
  baseurl: https://kuper994.github.io/Software-Project
  extra_footer: |
    By Rami Nasser, School of Computer Science and AI, Tel Aviv University,
    Tel Aviv 6997801, Israel.

repository:
  url: https://github.com/Kuper994/Software-Project
  branch: main

sphinx:
  recursive_update: true
  config:
    html_title: "Software Project<br>0368-2161"
    exclude_patterns:
      - .venv
      - .venv/**
      - .git
      - .git/**
      - _build
      - _build/**
    html_theme_options:
      show_toc_level: 2
      show_navbar_depth: 2
      max_navbar_depth: 2
